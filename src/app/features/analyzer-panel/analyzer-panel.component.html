<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
    <!-- Left Side: Uploader and Image Preview -->
    <app-photo-panel
      [(analysis)]="analysis"
      [(error)]="error"
      [isLoading]="isLoading()"
      (emitFile)="handleGenerateClick($event)"
    />

    <!-- Right Side: Results -->
    <app-alt-text-panel
      [analysis]="analysis()"
      [error]="error()"
      [isLoading]="isLoading()"
    />
</div>
